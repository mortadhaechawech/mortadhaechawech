# Metrics — Engineering Intelligence
# Generates the metrics assets with lowlighter/metrics (official action).
#
# Two renders, split for a compact dashboard (no single 1100px-tall SVG):
#   assets/github-metrics.svg        — ACTIVITY card: isometric calendar + habits
#   assets/github-metrics-detail.svg — SIGNAL card: languages + recent activity + featured repos
#
# Safety properties:
#   - action pinned to an immutable commit SHA (verified 2026-11-02)
#   - queries use METRICS_TOKEN (classic PAT, public_repo scope) — see docs/INSTALLATION.md
#   - commits use the default committer_token (GITHUB_TOKEN), no extra secret needed
#   - commit messages carry [skip ci] so commits never re-trigger workflows
#   - concurrency: a running generation cannot pile up duplicates

name: Metrics — Engineering Intelligence

on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-refresh
  cancel-in-progress: false

jobs:
  metrics:
    name: Generate metrics dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ─── Card 1/2 · ACTIVITY: isometric calendar + coding habits ───
      - name: Render metrics — activity card
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master@2026-11-02
        with:
          token: ${{ secrets.METRICS_TOKEN }} # GitHub PAT — minimum: public_repo (classic PAT)
          user: mortadhaechawech
          filename: assets/github-metrics.svg
          config_timezone: Europe/Paris
          use_prebuilt_image: yes
          base: header, activity
          base_hireable: no
          # dark palette alignment — CSS selectors match the actual generated SVG
          # structure (verified 2026-11-02 on real output), palette-consistent
          extras_css: |
            @media (prefers-color-scheme: dark) {
              svg { color: #C9D2E3 }
              h1, h2, h3 { color: #38BDF8 }
              .field svg { fill: #94A3B8 }
              .field.error { color: #F87171 }
              .field.error svg { fill: #F87171 }
              footer { color: #94A3B8 }
              .calendar .day { outline-color: rgba(148, 163, 184, .08) }
              :root {
                --color-calendar-graph-day-bg: #111C2E;
                --color-calendar-graph-day-border: rgba(148, 163, 184, .08);
              }
            }
          # real GitHub contribution data
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          committer_message: "chore(metrics): refresh activity card [skip ci]"

      # ─── Card 2/2 · SIGNAL: languages + recent activity + featured repos ───
      - name: Render metrics — signal card
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master@2026-11-02
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mortadhaechawech
          filename: assets/github-metrics-detail.svg
          config_timezone: Europe/Paris
          use_prebuilt_image: yes
          base_skip: yes # no header: card 1 already carries identity
          extras_css: |
            @media (prefers-color-scheme: dark) {
              svg { color: #C9D2E3 }
              h1, h2, h3 { color: #38BDF8 }
              .field svg { fill: #94A3B8 }
              .field.error { color: #F87171 }
              .field.error svg { fill: #F87171 }
              footer { color: #94A3B8 }
              .repository .name span:first-child { color: #38BDF8 }
              .repository .name span:last-child { color: #64748B }
              .repository .description, .repository .infos { color: #94A3B8 }
              .activity .issue { color: #38BDF8 }
            }
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_visibility: public
          plugin_repositories: yes
          plugin_repositories_featured: aws-cloudops-platform, aws-devops-springboot-postgres, spring-boot-rest-api-postgresql
          plugin_repositories_forks: no
          committer_message: "chore(metrics): refresh signal card [skip ci]"
